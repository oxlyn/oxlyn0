    <!--
      Apply the persisted appearance BEFORE first paint. The zustand store
      (src/system/stores/system.ts) also restores it, but only in a React
      effect — i.e. after the first frame — which flashed dark for anyone who
      had chosen light. Keep this key in sync with the store's `name`.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('macos27.system') || '{}')
        var theme = saved && saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {}
    </script>
