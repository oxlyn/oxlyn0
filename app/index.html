<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oxlyn — operator (Dubbs Capital, Snappy, Union Made Apparel) building toward AI engineering. An interactive resume running as a full macOS simulation in your browser." />
    <title>Oxlyn — Interactive Resume</title>
    <link rel="icon" type="image/svg+xml" href="avatar.svg" />
    <!--
      Apply the persisted appearance BEFORE first paint. The zustand store
      (src/system/stores/system.ts) also restores it, but only in a React
      effect — i.e. after the first frame — which flashed dark for anyone who
      had chosen light. Keep this key in sync with the store's `name`.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('macos27.system') || '{}')
        var theme = saved && saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Liquid Glass SVG refraction filter (Chromium: backdrop-filter uses it on system surfaces) -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <filter id="lg-refraction" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"></feTurbulence>
          <feGaussianBlur in="noise" stdDeviation="2.2" result="soft"></feGaussianBlur>
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="12" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
